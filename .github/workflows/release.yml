# Publishes a GitHub release for every push to main, tagged vX.Y.Z by semantic-release from the
# conventional commits since the last release (.releaserc.yaml), with its binaries, Docker image
# and Homebrew cask.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Releases go out one at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json

    - name: Test
      run: dotnet test --configuration Release --verbosity normal

  tag:
    # A manual run from another branch publishes nothing.
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # semantic-release needs the full history and the tags.
        fetch-depth: 0

    # Tags HEAD and creates its release as a draft. A run behind origin/main (a re-run of an older
    # commit) or without a conventional commit since the last release publishes nothing.
    - name: Tag the release
      uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34 # v8.1.3
      with:
        semantic_version: 25.0.9
        # The preset's 10.x needs conventional-changelog-writer 9; release-notes-generator 14 ships 8.
        extra_plugins: |
          conventional-changelog-conventionalcommits@9.3.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # The draft of HEAD, from this run or from a failed one, so a re-run finishes it.
    - name: Find the draft release
      id: draft
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
        if [ -n "$tag" ] && [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]; then
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        fi

  build-binaries:
    needs: tag
    if: needs.tag.outputs.tag != ''
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: ubuntu-latest
            runtime: linux-arm64
          - os: macos-latest
            runtime: osx-x64
          - os: macos-latest
            runtime: osx-arm64
          - os: windows-latest
            runtime: win-x64
          - os: windows-latest
            runtime: win-arm64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ needs.tag.outputs.tag }}

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json

    - name: Publish
      shell: bash
      env:
        TAG: ${{ needs.tag.outputs.tag }}
      run: dotnet publish src/CLI/CLI.csproj --configuration Release --runtime ${{ matrix.runtime }} --self-contained true "-p:Version=${TAG#v}" -p:PublishSingleFile=true -p:PublishTrimmed=false -p:IncludeNativeLibrariesForSelfExtract=true --output ./publish/${{ matrix.runtime }}

    # The names are what install.sh, install.ps1 and ModularGuard-action download.
    - name: Create archive (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd ./publish/${{ matrix.runtime }}
        tar -czf ../../modularguard-${{ matrix.runtime }}.tar.gz *

    - name: Create archive (Windows)
      if: runner.os == 'Windows'
      run: |
        cd ./publish/${{ matrix.runtime }}
        Compress-Archive -Path * -DestinationPath ../../modularguard-${{ matrix.runtime }}.zip

    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: modularguard-${{ matrix.runtime }}
        path: |
          modularguard-${{ matrix.runtime }}.tar.gz
          modularguard-${{ matrix.runtime }}.zip

  release:
    needs: [tag, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # cosign's keyless signature.
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Download all artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        path: ./artifacts
        pattern: modularguard-*
        merge-multiple: true

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    # Signs checksums.txt keyless, with the OIDC token of this run.
    - name: Checksum and sign
      working-directory: ./artifacts
      run: |
        sha256sum modularguard-* > checksums.txt
        cosign sign-blob --bundle checksums.txt.sigstore.json checksums.txt --yes

    # Attaches the files to the draft, then publishes it: releases/latest never points to a release without them.
    - name: Publish the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.tag.outputs.tag }}
      run: |
        gh release upload "$TAG" ./artifacts/* --clobber
        gh release edit "$TAG" --draft=false --latest

    # brew install --cask n2jsoft-public-org/tap/modularguard
    - name: Update the Homebrew cask
      env:
        TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        TAG: ${{ needs.tag.outputs.tag }}
      run: |
        if [ -z "$TAP_GITHUB_TOKEN" ]; then
          echo "::warning::TAP_GITHUB_TOKEN is not set: the Homebrew cask is not updated."
          exit 0
        fi
        git clone --depth 1 "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/n2jsoft-public-org/homebrew-tap.git" tap
        scripts/homebrew-cask.sh "${TAG#v}" ./artifacts/checksums.txt > tap/Casks/modularguard.rb
        cd tap
        git add Casks/modularguard.rb
        git -c user.name="github-actions[bot]" -c user.email="41898900+github-actions[bot]@users.noreply.github.com" \
          commit -m "modularguard $TAG"
        git push

  build-docker:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ needs.tag.outputs.tag }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}
          type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.tag }}
          type=semver,pattern={{major}},value=${{ needs.tag.outputs.tag }}
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: src/CLI/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
